name: Stage TX and NC Call the Map county pilots (v7.2)
on:
  push:
    branches: [feature/v7-2-national-county-data]
    paths:
      - 'scripts/stage_callthemap_county_pilots.py'
      - 'scripts/run_tx_nc_county_pipeline.py'
      - 'tests/test_run_tx_nc_county_pipeline.py'
      - 'tests/preview_real_county_candidate_browser.py'
      - 'tests/test_callthemap_county_pilots.py'
      - 'scripts/verify_tx_nc_fips.py'
      - 'scripts/build_county_preview.py'
      - 'scripts/validate_tx_local_returns.py'
      - 'tests/test_tx_local_returns.py'
      - 'scripts/check_tx_precinct_geometry.py'
      - 'tests/test_tx_precinct_geometry.py'
      - 'scripts/normalize_collin_precinct_geojson.py'
      - 'tests/test_collin_precinct_geojson.py'
      - 'scripts/fetch_collin_precinct_geojson.py'
      - 'tests/test_fetch_collin_precinct_geojson.py'
      - 'scripts/check_collin_2026_geometry_manifest.py'
      - 'tests/test_collin_2026_geometry_manifest.py'
      - 'tests/test_collin_precinct_integration.py'
      - 'tests/test_county_preview.py'
      - 'scripts/validate_county_publication_candidate.py'
      - 'tests/test_county_publication_candidate.py'
      - 'scripts/prepare_approved_county_feed.py'
      - 'tests/test_prepare_approved_county_feed.py'
      - 'tests/test_tx_nc_fips.py'
      - '.github/workflows/stage-callthemap-county-pilots.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run county validation tests
        run: python -m unittest discover -s tests -p 'test_callthemap_county_pilots.py' -v
      - name: Download, validate, and stage real TX/NC county data
        run: python scripts/stage_callthemap_county_pilots.py --output-dir staging-county-pilots
      - name: Test Census FIPS verification
        run: python -m unittest discover -s tests -p 'test_tx_nc_fips.py' -v
      - name: Verify complete Census FIPS geography and enrich staging records
        run: python scripts/verify_tx_nc_fips.py --input-dir staging-county-pilots --output-dir staging-county-pilots-fips
      - name: Test preview publication guards
        run: python -m unittest discover -s tests -p 'test_county_preview.py' -v
      - name: Test local precinct staging safeguards
        run: python -m unittest discover -s tests -p 'test_tx_local_returns.py' -v
      - name: Test local precinct geometry join safeguards
        run: python -m unittest discover -s tests -p 'test_tx_precinct_geometry.py' -v
      - name: Test Collin precinct GeoJSON normalization
        run: python -m unittest discover -s tests -p 'test_collin_precinct_geojson.py' -v
      - name: Test official Collin GIS pagination
        run: python -m unittest discover -s tests -p 'test_fetch_collin_precinct_geojson.py' -v
      - name: Test Collin 2026 boundary provenance gates
        run: python -m unittest discover -s tests -p 'test_collin_2026_geometry_manifest.py' -v
      - name: Test Collin normalization and aggregate join integration
        run: python -m unittest discover -s tests -p 'test_collin_precinct_integration.py' -v
      - name: Build non-publication county preview
        run: python scripts/build_county_preview.py --input-dir staging-county-pilots-fips --output staging-county-preview.json
      - name: Build TX/NC county publication candidate (approval still required)
        run: python scripts/build_county_preview.py --candidate --input-dir staging-county-pilots-fips --output staging-county-publication-candidate.json
      - name: Test publication candidate review gate
        run: python -m unittest discover -s tests -p 'test_county_publication_candidate.py' -v
      - name: Test explicit owner-approval conversion without publishing
        run: python -m unittest discover -s tests -p 'test_prepare_approved_county_feed.py' -v
      - name: Validate candidate without publishing
        run: python scripts/validate_county_publication_candidate.py --candidate staging-county-publication-candidate.json
      - name: Test end-to-end county pipeline with partial reports
        run: python -m unittest discover -s tests -p 'test_run_tx_nc_county_pipeline.py' -v
      - name: Install headless browser for real-data dashboard preview
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Render actual staged county totals in existing dashboard
        run: python tests/preview_real_county_candidate_browser.py
      - name: Upload staging-only county records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tx-nc-county-pilot-staging
          path: |
            staging-county-pilots/
            staging-county-pilots-fips/
            staging-county-preview.json
            staging-county-publication-candidate.json
            staging-county-browser-preview/
          if-no-files-found: ignore
          retention-days: 7
