name: Test v7.2 battleground browser
on:
  push:
    branches: [feature/v7-2-national-county-data]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  battleground-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/test_battleground_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: electionhq-battleground-browser-screenshots
          path: /tmp/electionhq-battleground-*.png
          if-no-files-found: ignore
