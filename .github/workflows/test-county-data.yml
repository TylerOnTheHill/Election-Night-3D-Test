name: Validate v7.2 county data adapters
on:
  push:
    branches:
      - feature/v7-2-national-county-data
    paths:
      - 'scripts/**'
      - 'tests/test_*adapter.py'
      - 'tests/test_callthemap_florida_adapter.py'
      - 'data/sources/**'
      - 'data/early-vote/**'
      - '.github/workflows/test-county-data.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/test_*adapter.py'
      - 'tests/test_callthemap_florida_adapter.py'
      - 'data/sources/**'
      - 'data/early-vote/**'
      - '.github/workflows/test-county-data.yml'
  workflow_dispatch:
concurrency:
  group: county-adapters-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source registry
        run: python scripts/validate_source_registry.py
      - name: Validate all 67 Florida county audit records
        run: python scripts/validate_florida_county_audit.py
      - name: Run Call the Map Florida county reconciliation tests
        run: python -m unittest discover -s tests -p 'test_callthemap_florida_adapter.py' -v
      - name: Run county adapter unit tests
        run: python -m unittest discover -s tests -p 'test_*adapter.py' -v
