name: Test v7 national dashboard
on:
  push:
    branches: [feature/v7-national-early-vote, feature/v7-1-contextual-early-dashboard]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: python tests/test_v7_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: electionhq-v7-browser-screenshot
          path: |
            /tmp/electionhq-national.png
            /tmp/electionhq-mobile.png
          if-no-files-found: ignore
