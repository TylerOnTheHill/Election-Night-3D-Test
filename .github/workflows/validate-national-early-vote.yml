name: Validate national early vote (v7.2)
on:
  push:
    branches: [feature/v7-2-national-county-data]
    paths:
      - 'data/early-vote/US.json'
      - 'data/early-vote/public-source-fallbacks.json'
      - 'scripts/validate_public_source_fallbacks.py'
      - 'scripts/validate_national_early_vote.py'
      - 'tests/test_validate_national_early_vote.py'
      - '.github/workflows/validate-national-early-vote.yml'
      - 'scripts/audit_national_early_vote.py'
      - 'tests/test_audit_national_early_vote.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: National data validation unit tests
        run: python -m unittest discover -s tests -p 'test_validate_national_early_vote.py' -v
      - name: Verify nationwide and watchlist missing-state handling
        run: python -m unittest discover -s tests -p 'test_audit_national_early_vote.py' -v
      - name: Audit national and watchlist coverage
        run: python scripts/audit_national_early_vote.py --output /tmp/national-watchlist-coverage-audit.json
      - name: Validate actual national feed and report provenance
        run: python scripts/validate_national_early_vote.py --report /tmp/national-source-audit.json
      - name: Validate independently sourced fallback observations
        run: python scripts/validate_public_source_fallbacks.py
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: national-early-vote-source-audit
          path: |
            /tmp/national-source-audit.json
            /tmp/national-watchlist-coverage-audit.json
          retention-days: 7
