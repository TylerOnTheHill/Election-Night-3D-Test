name: Stage VA IA WI SC county observations (v7.2)
on:
  workflow_dispatch:
  push:
    branches: [feature/v7-2-national-county-data]
    paths:
      - 'scripts/stage_watchlist_counties.py'
      - 'scripts/audit_watchlist_county_reconciliation.py'
      - 'scripts/review_county_source_freshness.py'
      - 'tests/test_review_county_source_freshness.py'
      - 'tests/test_stage_watchlist_counties.py'
      - 'scripts/validate_county_publication_candidate.py'
      - '.github/workflows/stage-watchlist-counties.yml'
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify four-state partial reporting behavior
        run: python -m unittest discover -s tests -p 'test_stage_watchlist_counties.py' -v
      - name: Verify source freshness classification tests
        run: python -m unittest discover -s tests -p 'test_review_county_source_freshness.py' -v
      - name: Download and stage provider county observations
        run: python scripts/stage_watchlist_counties.py --output watchlist-county-candidate-unapproved.json
      - name: Audit county and statewide reconciliation without publication
        run: python scripts/audit_watchlist_county_reconciliation.py --candidate watchlist-county-candidate-unapproved.json --output watchlist-county-reconciliation-audit.json
      - name: Review source timestamps and freshness limitations
        run: python scripts/review_county_source_freshness.py --candidate watchlist-county-candidate-unapproved.json --output watchlist-county-freshness-review.json
      - name: Upload unapproved county candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: va-ia-wi-sc-county-staging
          path: |
            watchlist-county-candidate-unapproved.json
            watchlist-county-reconciliation-audit.json
            watchlist-county-freshness-review.json
          if-no-files-found: ignore
          retention-days: 7
