name: Refresh 2026 early vote aggregates
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and mirror aggregate feed
        run: python scripts/refresh_early_vote.py
      - name: Commit changed snapshot
        run: |
          if ! git diff --quiet -- data/early-vote/US.json || [ -n "$(git ls-files --others --exclude-standard data/early-vote/US.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/early-vote/US.json
            git commit -m "data: refresh attributed 2026 early-vote snapshot"
            git push
          fi
