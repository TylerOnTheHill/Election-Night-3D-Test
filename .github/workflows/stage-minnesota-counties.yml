name: Stage official Minnesota 2026 county early ballots (v7.2)
on:
  workflow_dispatch:
  push:
    branches: [feature/v7-2-national-county-data]
    paths:
      - 'scripts/stage_minnesota_counties.py'
      - 'tests/test_stage_minnesota_counties.py'
      - 'scripts/validate_county_publication_candidate.py'
      - '.github/workflows/stage-minnesota-counties.yml'
permissions:
  contents: read
jobs:
  stage-minnesota:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v7-2-national-county-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Minnesota official county parser
        run: python -m unittest discover -s tests -p 'test_stage_minnesota_counties.py' -v
      - name: Fetch and stage official Minnesota county aggregates
        run: python scripts/stage_minnesota_counties.py --output minnesota-unapproved.json
      - name: Validate Minnesota county candidate
        run: python scripts/validate_county_publication_candidate.py --candidate minnesota-unapproved.json
      - name: Upload staging only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minnesota-official-county-candidate-not-for-publication
          path: minnesota-unapproved.json
          if-no-files-found: ignore
          retention-days: 7
