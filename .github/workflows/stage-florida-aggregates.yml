name: Validate Florida daily official county aggregates (v7.2 staging)
on:
  workflow_dispatch:
  schedule:
    - cron: '30 14 * * *'
permissions:
  contents: read
jobs:
  validate-florida:
    runs-on: ubuntu-latest
    if: ${{ vars.FL_EARLY_TSV_URL != '' && vars.FL_RETURNED_TSV_URL != '' && vars.FL_OUTSTANDING_TSV_URL != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v7-2-national-county-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate official Florida aggregate files
        env:
          FL_EARLY_TSV_URL: ${{ vars.FL_EARLY_TSV_URL }}
          FL_RETURNED_TSV_URL: ${{ vars.FL_RETURNED_TSV_URL }}
          FL_OUTSTANDING_TSV_URL: ${{ vars.FL_OUTSTANDING_TSV_URL }}
        run: |
          python scripts/fetch_florida_aggregates.py \
            --early-url "$FL_EARLY_TSV_URL" \
            --returned-url "$FL_RETURNED_TSV_URL" \
            --outstanding-url "$FL_OUTSTANDING_TSV_URL" \
            --output florida-latest.json
      - name: Test official Florida county candidate adapter
        run: python -m unittest discover -s tests -p "test_stage_florida_county_candidate.py" -v
      - name: Build unapproved Florida county publication candidate
        run: |
          python scripts/stage_florida_county_candidate.py \
            --official-tsv-snapshot florida-latest.json \
            --output florida-county-candidate-unapproved.json
      - name: Upload validated staging snapshot
        uses: actions/upload-artifact@v4
        with:
          name: florida-validated-snapshot
          path: |
            florida-latest.json
            florida-county-candidate-unapproved.json
          retention-days: 14
