name: Validate Florida daily official county aggregates (v7.2 staging)
on:
  workflow_dispatch:
  push:
    branches: [feature/v7-2-national-county-data]
    paths:
      - "scripts/stage_florida_county_candidate.py"
      - "tests/test_stage_florida_county_candidate.py"
      - ".github/workflows/stage-florida-aggregates.yml"
      - "scripts/fetch_florida_aggregates.py"
  schedule:
    - cron: '30 14 * * *'
permissions:
  contents: read
jobs:
  validate-florida:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v7-2-national-county-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate official Florida aggregate files
        run: python scripts/fetch_florida_aggregates.py --output florida-latest.json
      - name: Test official Florida county candidate adapter
        run: python -m unittest discover -s tests -p "test_stage_florida_county_candidate.py" -v
      - name: Build unapproved Florida county publication candidate
        run: |
          python scripts/stage_florida_county_candidate.py \
            --official-tsv-snapshot florida-latest.json \
            --output florida-county-candidate-unapproved.json
      - name: Validate Florida candidate without publishing
        run: python scripts/validate_county_publication_candidate.py --candidate florida-county-candidate-unapproved.json
      - name: Build local Florida interactive review
        run: python scripts/build_local_battleground_preview.py --candidate florida-county-candidate-unapproved.json --output florida-interactive-review
      - name: Upload validated staging snapshot
        uses: actions/upload-artifact@v4
        with:
          name: florida-validated-snapshot
          path: |
            florida-latest.json
            florida-county-candidate-unapproved.json
            florida-interactive-review/
          retention-days: 14
