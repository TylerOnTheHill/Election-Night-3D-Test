name: Validate all 19 battleground states (v7.2)
on:
  workflow_dispatch:
  push:
    branches: [feature/v7-2-national-county-data]
    paths:
      - 'scripts/combine_county_candidates.py'
      - 'scripts/stage_georgia_counties.py'
      - 'battleground-county-preview.js'
      - 'scripts/import_florida_tsv.py'
      - 'tests/test_florida_blank_compile_date.py'
      - 'scripts/stage_minnesota_counties.py'
      - 'scripts/stage_remaining_eleven_counties.py'
      - 'scripts/stage_uf_county_review.py'
      - 'scripts/stage_alaska_official_statewide.py'
      - 'tests/test_stage_alaska_official_statewide.py'
      - 'tests/test_stage_uf_county_review.py'
      - 'scripts/merge_restricted_nineteen_state_review.py'
      - 'tests/test_merge_restricted_nineteen_state_review.py'
      - 'tests/test_stage_remaining_eleven_counties.py'
      - 'tests/test_stage_minnesota_counties.py'
      - 'scripts/audit_nineteen_state_pipeline.py'
      - 'tests/test_audit_nineteen_state_pipeline.py'
      - 'scripts/build_watchlist_readiness.py'
      - 'tests/test_build_watchlist_readiness.py'
      - 'tests/test_stage_georgia_counties.py'
      - 'scripts/audit_remaining_watchlist_county_sources.py'
      - 'tests/test_audit_remaining_watchlist_county_sources.py'
      - 'scripts/validate_official_county_source_leads.py'
      - 'data/sources/remaining-watchlist-official-source-leads.json'
      - 'tests/test_combine_county_candidates.py'
      - 'tests/test_watchlist_interactive_review_browser.py'
      - 'scripts/audit_watchlist_county_reconciliation.py'
      - 'tests/test_audit_watchlist_county_reconciliation.py'
      - '.github/workflows/stage-seven-state-counties.yml'
concurrency:
  group: nineteen-state-county-review-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  nineteen-state-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v7-2-national-county-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate consolidated 19-state readiness semantics
        run: python -m unittest discover -s tests -p 'test_build_watchlist_readiness.py' -v
      - name: Validate Florida official TSV timestamp handling
        run: python -m unittest discover -s tests -p 'test_florida_blank_compile_date.py' -v
      - name: Verify duplicate-safe combination
        run: python -m unittest discover -s tests -p 'test_combine_county_candidates.py' -v
      - name: Test reconciliation classifications
        run: python -m unittest discover -s tests -p "test_audit_watchlist_county_reconciliation.py" -v
      - name: Test official Minnesota source adapter
        run: python -m unittest discover -s tests -p 'test_stage_minnesota_counties.py' -v
      - name: Test all-19 coverage invariants
        run: python -m unittest discover -s tests -p 'test_audit_nineteen_state_pipeline.py' -v
      - name: Test concurrent discovery of the remaining 11 states
        run: python -m unittest discover -s tests -p 'test_audit_remaining_watchlist_county_sources.py' -v
      - name: Discover all 11 remaining county feeds in parallel
        run: python scripts/audit_remaining_watchlist_county_sources.py --output eleven-state-discovery-unapproved.json
      - name: Batch-ingest remaining eleven county sources
        run: |
          python -m unittest discover -s tests -p 'test_stage_remaining_eleven_counties.py' -v
          python scripts/stage_remaining_eleven_counties.py --output remaining-eleven-unapproved.json --gaps-output remaining-eleven-gaps.json
      - name: Test UF source review CLI output
        run: python -m unittest discover -s tests -p 'test_stage_uf_county_review.py' -v
      - name: Review alternative UF county data for eleven states
        run: python scripts/stage_uf_county_review.py --output uf-eleven-county-source-review.json --candidate-output uf-eleven-fips-candidate-restricted.json
      - name: Ingest Alaska official statewide 2026 ballot snapshot
        run: |
          python -m unittest discover -s tests -p 'test_stage_alaska_official_statewide.py' -v
          python scripts/stage_alaska_official_statewide.py --output alaska-official-statewide-review.json
      - name: Stage current Texas and North Carolina county observations
        run: python scripts/run_tx_nc_county_pipeline.py --output tx-nc-unapproved.json
      - name: Stage current Virginia Iowa Wisconsin South Carolina observations
        run: python scripts/stage_watchlist_counties.py --output four-states-unapproved.json
      - name: Download official Florida aggregates
        run: python scripts/fetch_florida_aggregates.py --output florida-official.json
      - name: Stage Florida counties
        run: python scripts/stage_florida_county_candidate.py --official-tsv-snapshot florida-official.json --output florida-unapproved.json
      - name: Stage Georgia county observations
        run: python scripts/stage_georgia_counties.py --output georgia-unapproved.json
      - name: Combine all eight without additive double counting
        run: |
          python scripts/combine_county_candidates.py \
            --candidate tx-nc-unapproved.json \
            --candidate four-states-unapproved.json \
            --candidate florida-unapproved.json \
            --candidate georgia-unapproved.json \
            --output eight-states-unapproved.json
          python scripts/validate_county_publication_candidate.py --candidate eight-states-unapproved.json
      - name: Test combined restricted nineteen-state county merge
        run: python -m unittest discover -s tests -p 'test_merge_restricted_nineteen_state_review.py' -v
      - name: Merge observed counties into restricted nineteen-state coverage view
        run: python scripts/merge_restricted_nineteen_state_review.py --standard eight-states-unapproved.json --restricted uf-eleven-fips-candidate-restricted.json --output nineteen-state-observed-coverage-internal.json
      - name: Audit eight-state reporting cutoffs and reconciliation
        run: |
          python scripts/review_county_source_freshness.py --candidate eight-states-unapproved.json --output eight-state-freshness-audit.json
          python scripts/audit_watchlist_county_reconciliation.py --candidate eight-states-unapproved.json --output eight-state-reconciliation-audit.json
      - name: Build single 19-state readiness report
        run: |
          python scripts/build_watchlist_readiness.py --candidate eight-states-unapproved.json --output nineteen-state-readiness-unapproved.json
      - name: Audit all 19 states have explicit county coverage status
        run: python scripts/audit_nineteen_state_pipeline.py --readiness nineteen-state-readiness-unapproved.json --discovery eleven-state-discovery-unapproved.json --output nineteen-state-coverage-audit.json
      - name: Build watermarked eight-state interactive dashboard
        run: python scripts/build_local_battleground_preview.py --candidate eight-states-unapproved.json --output eight-state-interactive-review
      - name: Install Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify all eight states in actual browser
        env:
          COUNTY_REVIEW_DIR: eight-state-interactive-review
          COUNTY_CANDIDATE: eight-states-unapproved.json
        run: python tests/test_watchlist_interactive_review_browser.py
      - name: Upload unapproved eight-state interactive review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eight-state-interactive-review-not-for-publication
          path: |
            nineteen-state-readiness-unapproved.json
            eleven-state-discovery-unapproved.json
            remaining-eleven-unapproved.json
            remaining-eleven-gaps.json
            uf-eleven-county-source-review.json
            alaska-official-statewide-review.json
            uf-eleven-fips-candidate-restricted.json
            nineteen-state-observed-coverage-internal.json
            nineteen-state-coverage-audit.json
            eight-states-unapproved.json
            eight-state-freshness-audit.json
            eight-state-reconciliation-audit.json
            eight-state-interactive-review/
          if-no-files-found: ignore
          retention-days: 7
