name: Validate all 19 battleground states (v7.2)
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '23 */3 * * *'
  push:
    branches: [feature/v7-2-national-county-data]
    paths:
      - 'scripts/combine_county_candidates.py'
      - 'scripts/stage_georgia_counties.py'
      - 'scripts/stage_watchlist_counties.py'
      - 'tests/test_stage_watchlist_counties.py'
      - 'battleground-county-preview.js'
      - 'scripts/import_florida_tsv.py'
      - 'tests/test_florida_blank_compile_date.py'
      - 'scripts/stage_minnesota_counties.py'
      - 'scripts/stage_remaining_eleven_counties.py'
      - 'scripts/stage_uf_county_review.py'
      - 'scripts/stage_alaska_official_statewide.py'
      - 'scripts/stage_alaska_house_districts.py'
      - 'scripts/build_alaska_house_review.py'
      - 'tests/test_stage_alaska_house_districts.py'
      - 'data/staging/alaska-house-districts-2026-10-26.csv'
      - 'data/staging/alaska-house-district-review.json'
      - 'scripts/stage_maine_aggregated_counties.py'
      - 'scripts/probe_maine_official_absentee.py'
      - 'scripts/probe_votehub_l2_early_vote.py'
      - 'scripts/stage_ctm_ten_state_statewide.py'
      - 'scripts/stage_michigan_counties.py'
      - 'tests/test_stage_michigan_counties.py'
      - 'scripts/reconcile_remaining_ten_counties.py'
      - 'scripts/stage_public_county_tables_ten_states.py'
      - 'tests/test_stage_public_county_tables_ten_states.py'
      - 'scripts/stage_michigan_ohio_verified_counties.py'
      - 'scripts/stage_five_more_counties.py'
      - 'scripts/stage_maine_municipal_counties.py'
      - 'scripts/stage_new_hampshire_source_status.py'
      - 'tests/test_stage_maine_aggregated_counties.py'
      - 'tests/test_stage_alaska_official_statewide.py'
      - 'tests/test_stage_uf_county_review.py'
      - 'scripts/merge_restricted_nineteen_state_review.py'
      - 'tests/test_merge_restricted_nineteen_state_review.py'
      - 'tests/test_stage_remaining_eleven_counties.py'
      - 'tests/test_stage_minnesota_counties.py'
      - 'scripts/audit_nineteen_state_pipeline.py'
      - 'tests/test_audit_nineteen_state_pipeline.py'
      - 'scripts/audit_battleground_release_readiness.py'
      - 'scripts/capture_ci_failure.py'
      - 'tests/test_capture_ci_failure.py'
      - 'tests/test_audit_battleground_release_readiness.py'
      - 'scripts/build_watchlist_readiness.py'
      - 'tests/test_build_watchlist_readiness.py'
      - 'tests/test_stage_georgia_counties.py'
      - 'scripts/audit_remaining_watchlist_county_sources.py'
      - 'tests/test_audit_remaining_watchlist_county_sources.py'
      - 'scripts/validate_official_county_source_leads.py'
      - 'data/sources/remaining-watchlist-official-source-leads.json'
      - 'tests/test_combine_county_candidates.py'
      - 'tests/test_watchlist_interactive_review_browser.py'
      - 'scripts/audit_watchlist_county_reconciliation.py'
      - 'tests/test_audit_watchlist_county_reconciliation.py'
      - '.github/workflows/stage-seven-state-counties.yml'
concurrency:
  group: nineteen-state-county-review-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  actions: read
jobs:
  nineteen-state-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v7-2-national-county-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test CI failure diagnostic parser
        run: python -m unittest discover -s tests -p 'test_capture_ci_failure.py' -v
      - name: Validate consolidated 19-state readiness semantics
        run: python -m unittest discover -s tests -p 'test_build_watchlist_readiness.py' -v
      - name: Validate Florida official TSV timestamp handling
        run: python -m unittest discover -s tests -p 'test_florida_blank_compile_date.py' -v
      - name: Verify duplicate-safe combination
        run: python -m unittest discover -s tests -p 'test_combine_county_candidates.py' -v
      - name: Test reconciliation classifications
        run: python -m unittest discover -s tests -p "test_audit_watchlist_county_reconciliation.py" -v
      - name: Test Michigan county staging parser and candidate validation
        run: python -m unittest discover -s tests -p 'test_stage_michigan_counties.py' -v
      - name: Test official Minnesota source adapter
        run: python -m unittest discover -s tests -p 'test_stage_minnesota_counties.py' -v
      - name: Test all-19 coverage invariants
        run: python -m unittest discover -s tests -p 'test_audit_nineteen_state_pipeline.py' -v
      - name: Test concurrent discovery of the remaining 11 states
        run: python -m unittest discover -s tests -p 'test_audit_remaining_watchlist_county_sources.py' -v
      - name: Test 18-state battleground release gate without changing NH data
        run: python -m unittest discover -s tests -p 'test_audit_battleground_release_readiness.py' -v
      - name: Discover all 11 remaining county feeds in parallel
        run: python scripts/audit_remaining_watchlist_county_sources.py --output eleven-state-discovery-unapproved.json
      - name: Batch-ingest remaining eleven county sources
        run: |
          python -m unittest discover -s tests -p 'test_stage_remaining_eleven_counties.py' -v
          python scripts/stage_remaining_eleven_counties.py --output remaining-eleven-unapproved.json --gaps-output remaining-eleven-gaps.json
      - name: Test UF source review CLI output
        run: python -m unittest discover -s tests -p 'test_stage_uf_county_review.py' -v
      - name: Review alternative UF county data for eleven states
        run: python scripts/stage_uf_county_review.py --output uf-eleven-county-source-review.json --candidate-output uf-eleven-fips-candidate-restricted.json
      - name: Ingest Alaska official statewide 2026 ballot snapshot
        run: |
          python -m unittest discover -s tests -p 'test_stage_alaska_official_statewide.py' -v
          python scripts/stage_alaska_official_statewide.py --output alaska-official-statewide-review.json
      - name: Validate manually retrieved Alaska official House-district report
        run: |
          python -m unittest discover -s tests -p 'test_stage_alaska_house_districts.py' -v
          python scripts/stage_alaska_house_districts.py \
            --input-csv data/staging/alaska-house-districts-2026-10-26.csv \
            --source-url https://elections.alaska.gov/wp-content/uploads/2026/10/Combined-Ballot-Report-10_26_2026-10_31_33-AM.html \
            --output alaska-house-districts-unapproved.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("alaska-house-districts-unapproved.json").read_text())
          assert d["geographic_received_ballots"] == 46287
          assert d["nongeographic_received_ballots"] == 116
          assert d["total_received_ballots"] == 46403
          assert d["absentee_received"] == 15867
          assert d["early_vote_received"] == 30536
          assert d["publication_approved"] is False
          print("Alaska: 40 districts + special District 99, official total reconciled")
          PY
      - name: Rebuild and reconcile Alaska district map review from source CSV
        run: |
          python scripts/build_alaska_house_review.py \
            --input-csv data/staging/alaska-house-districts-2026-10-26.csv \
            --source-url https://elections.alaska.gov/wp-content/uploads/2026/10/Combined-Ballot-Report-10_26_2026-10_31_33-AM.html \
            --output alaska-house-district-review-generated.json
          python - <<'PY'
          import json
          from pathlib import Path
          actual=json.loads(Path("alaska-house-district-review-generated.json").read_text())
          checked_in=json.loads(Path("data/staging/alaska-house-district-review.json").read_text())
          assert actual == checked_in, "Alaska review is out of sync with validated CSV"
          assert actual["publication_approved"] is False
          print("Alaska browser review matches validated source CSV")
          PY
      - name: Ingest Michigan official-dashboard county CSV
        run: python scripts/stage_michigan_counties.py --output michigan-unapproved.json || echo "Michigan CSV schema requires review; do not publish"
      - name: Ingest verified credited statewide early-vote totals for remaining ten
        run: python scripts/stage_ctm_ten_state_statewide.py --output ten-state-statewide-observations.json
      - name: Stage 2026 Michigan and Ohio actual county ballot aggregates
        run: python scripts/stage_michigan_ohio_verified_counties.py --output michigan-ohio-county-candidates.json
      - name: Assert Michigan Ohio county artifact integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("michigan-ohio-county-candidates.json").read_text())["states"]
          for state,expected in (("MI",83),("OH",88)):
            rows=d[state]["counties"]
            assert len(rows)==expected
            assert len({r["fips"] for r in rows})==expected
            assert sum(r["total"] for r in rows)==d[state]["total"]
            assert all(r["fips"].startswith({"MI":"26","OH":"39"}[state]) for r in rows)
          assert d["OH"]["total"]==d["OH"]["returned_total"]+d["OH"]["in_person_total"]
          print("Michigan and Ohio: 171 unique county FIPS and reconciled subtotals")
          PY
      - name: Test county source retrieval timestamp evidence
        run: python -m unittest discover -s tests -p 'test_stage_public_county_tables_ten_states.py' -v
      - name: Retrieve real county tables for ten states concurrently
        run: python scripts/stage_public_county_tables_ten_states.py --output ten-state-provider-county-tables.json
      - name: Stage Arizona Kansas Mississippi Nebraska Nevada county candidates
        run: python scripts/stage_five_more_counties.py --source ten-state-provider-county-tables.json --output five-more-county-candidates.json
      - name: Aggregate Maine municipal observations into county candidates
        run: python scripts/stage_maine_municipal_counties.py --source ten-state-provider-county-tables.json --output maine-municipal-county-candidate.json
      - name: Reconcile ten states county-first against available statewide figures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("ten-state-statewide-observations.json").read_text())
          Path("ten-state-official-comparison.json").write_text(json.dumps({
            s:(r["total"] if r.get("status")=="statewide_observed" and "Secretary of State" in r.get("source_name","") else None)
            for s,r in d["states"].items()}))
          # Real observations are supplied by the concurrent provider retrieval.
          # Do not mark unlicensed provider data as publication-ready.
          provider=json.loads(Path("ten-state-provider-county-tables.json").read_text())
          Path("ten-state-licensed-county-observations.json").write_text(
            json.dumps(provider["observations"]))
          PY
          python scripts/reconcile_remaining_ten_counties.py --observations ten-state-licensed-county-observations.json --official-statewide ten-state-official-comparison.json --output ten-state-county-reconciliation.json
      - name: Check VoteHub and L2 dashboards across all 19 states
        run: python scripts/probe_votehub_l2_early_vote.py --output votehub-l2-source-review.json
      - name: Discover Maine SOS 2026 absentee file
        run: python scripts/probe_maine_official_absentee.py --output maine-official-source-review.json
      - name: Ingest Maine CC BY absentee county aggregates
        run: |
          python -m unittest discover -s tests -p 'test_stage_maine_aggregated_counties.py' -v
          python scripts/stage_maine_aggregated_counties.py --output maine-county-review.json
      - name: Record New Hampshire official county source availability
        run: python scripts/stage_new_hampshire_source_status.py --output new-hampshire-county-status.json
      - name: Stage Minnesota official accepted county ballots
        run: python scripts/stage_minnesota_counties.py --output minnesota-unapproved.json
      - name: Stage current Texas and North Carolina county observations
        run: python scripts/run_tx_nc_county_pipeline.py --output tx-nc-unapproved.json
      - name: Stage current Virginia Iowa Wisconsin South Carolina observations
        run: python scripts/stage_watchlist_counties.py --output four-states-unapproved.json
      - name: Download official Florida aggregates
        run: python scripts/fetch_florida_aggregates.py --output florida-official.json
      - name: Stage Florida counties
        run: python scripts/stage_florida_county_candidate.py --official-tsv-snapshot florida-official.json --output florida-unapproved.json
      - name: Stage Georgia county observations
        run: python scripts/stage_georgia_counties.py --output georgia-unapproved.json
      - name: Combine all nine official and standard county candidates without additive double counting
        run: |
          python scripts/combine_county_candidates.py \
            --candidate tx-nc-unapproved.json \
            --candidate four-states-unapproved.json \
            --candidate florida-unapproved.json \
            --candidate georgia-unapproved.json \
            --candidate minnesota-unapproved.json \
            --candidate michigan-ohio-county-candidates.json \
            --candidate five-more-county-candidates.json \
            --candidate maine-municipal-county-candidate.json \
            --output eight-states-unapproved.json
          python scripts/validate_county_publication_candidate.py --candidate eight-states-unapproved.json
      - name: Test combined restricted nineteen-state county merge
        run: python -m unittest discover -s tests -p 'test_merge_restricted_nineteen_state_review.py' -v
      - name: Merge observed counties into restricted nineteen-state coverage view
        run: python scripts/merge_restricted_nineteen_state_review.py --standard eight-states-unapproved.json --restricted uf-eleven-fips-candidate-restricted.json --output nineteen-state-observed-coverage-internal.json
      - name: Audit staged-state reporting cutoffs and reconciliation
        run: |
          python scripts/review_county_source_freshness.py --candidate eight-states-unapproved.json --output eight-state-freshness-audit.json
          python scripts/audit_watchlist_county_reconciliation.py --candidate eight-states-unapproved.json --output eight-state-reconciliation-audit.json
      - name: Build single 19-state readiness report
        run: |
          python scripts/build_watchlist_readiness.py --candidate eight-states-unapproved.json --alaska-district-review alaska-house-districts-unapproved.json --output nineteen-state-readiness-unapproved.json
      - name: Audit all 19 states have explicit county coverage status
        run: python scripts/audit_nineteen_state_pipeline.py --readiness nineteen-state-readiness-unapproved.json --discovery eleven-state-discovery-unapproved.json --output nineteen-state-coverage-audit.json
      - name: Audit 18-state battleground release readiness (NH excluded, not deleted)
        run: python scripts/audit_battleground_release_readiness.py --readiness nineteen-state-readiness-unapproved.json --output eighteen-state-release-gate-unapproved.json
      - name: Build watermarked nine-state interactive dashboard
        run: python scripts/build_local_battleground_preview.py --candidate eight-states-unapproved.json --output eight-state-interactive-review
      - name: Install Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify staged states in actual browser
        env:
          COUNTY_REVIEW_DIR: eight-state-interactive-review
          COUNTY_CANDIDATE: eight-states-unapproved.json
        run: python tests/test_watchlist_interactive_review_browser.py
      - name: Capture failed steps to a repository-readable diagnostic file
        if: failure()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/capture_ci_failure.py --output data/ci-diagnostics/latest-county-review.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ci-diagnostics/latest-county-review.json
          if ! git diff --cached --quiet; then
            git commit -m "ci: record latest failed county review steps [skip ci]"
            git push origin HEAD:feature/v7-2-national-county-data
          fi
      - name: Upload unapproved eight-state interactive review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eight-state-interactive-review-not-for-publication
          path: |
            nineteen-state-readiness-unapproved.json
            eighteen-state-release-gate-unapproved.json
            eleven-state-discovery-unapproved.json
            remaining-eleven-unapproved.json
            remaining-eleven-gaps.json
            uf-eleven-county-source-review.json
            alaska-official-statewide-review.json
            maine-county-review.json
            maine-official-source-review.json
            votehub-l2-source-review.json
            ten-state-statewide-observations.json
            ten-state-county-reconciliation.json
            ten-state-provider-county-tables.json
            michigan-ohio-county-candidates.json
            five-more-county-candidates.json
            maine-municipal-county-candidate.json
            new-hampshire-county-status.json
            uf-eleven-fips-candidate-restricted.json
            nineteen-state-observed-coverage-internal.json
            nineteen-state-coverage-audit.json
            eight-states-unapproved.json
            minnesota-unapproved.json
            eight-state-freshness-audit.json
            eight-state-reconciliation-audit.json
            eight-state-interactive-review/
          if-no-files-found: ignore
          retention-days: 7

      - name: Record county review outcome for independent verification
        if: always()
        continue-on-error: true
        env:
          REVIEW_STATUS: ${{ job.status }}
          REVIEW_RUN_ID: ${{ github.run_id }}
          REVIEW_SHA: ${{ github.sha }}
          REVIEW_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          files = ["nineteen-state-readiness-unapproved.json", "eighteen-state-release-gate-unapproved.json", "nineteen-state-coverage-audit.json"]
          record = {
              "schema": "electionhq-county-review-verification-v1",
              "run_id": int(os.environ["REVIEW_RUN_ID"]),
              "run_attempt": int(os.environ["REVIEW_ATTEMPT"]),
              "head_sha": os.environ["REVIEW_SHA"],
              "job_steps_status": os.environ["REVIEW_STATUS"],
              "required_artifacts": {p: Path(p).is_file() for p in files},
              "publication_approved": False
          }
          out = Path("data/ci-diagnostics/latest-county-review-verification.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(record, indent=2) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ci-diagnostics/latest-county-review-verification.json
          if ! git diff --cached --quiet; then
            git commit -m "ci: record county review verification [skip ci]"
            git pull --rebase origin feature/v7-2-national-county-data
            git push origin HEAD:feature/v7-2-national-county-data
          fi
